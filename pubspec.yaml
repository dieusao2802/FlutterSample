name: todo_list
description: "A Flutter MVVM Todo App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # --- NETWORK & API ---
  dio: ^5.9.2

  # --- STATE MANAGEMENT & DI ---
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  get_it: ^9.2.1

  # --- LOCAL STORAGE ---
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  path: ^1.9.1

  # --- UTILITIES ---
  intl: ^0.20.2
  equatable: ^2.0.8
  json_annotation: ^4.11.0
  pigeon: ^26.3.2

  # --- NOTIFICATIONS ---
  flutter_local_notifications: ^21.0.0

  # --- UI COMPONENTS ---
  flutter_spinkit: ^5.2.2

  #--- UI Splash ---
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # --- CODE GENERATION ---
  build_runner: ^2.4.15
  riverpod_generator: ^4.0.2
  json_serializable: ^6.11.0

flutter_native_splash:
  color: "#4CAF50"
  android: true
  ios: true
  
  android_12:
    color: "#4CAF50"
    image: assets/images/logo.png
    icon_background_color: "#4CAF50"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
